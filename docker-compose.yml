version: '3.8'

services:
  aeolus:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: aeolus-trading-platform
    ports:
      - "8000:8000"
    environment:
      - PYTHONUNBUFFERED=1
      - DEFAULT_CUTOFF_TIME=12:00
    volumes:
      - ./data:/app/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/api/health"]
      interval: 30s
      timeout: 10s
      retries: 3
